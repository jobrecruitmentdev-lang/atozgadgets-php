name: Deploy to Hostinger Shared Hosting

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, sqlite3, bcmath, curl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Run Test Suite
        run: ./vendor/bin/phpunit tests/Feature/CriticalPath tests/Feature/SeoMasterPlanTest.php

      - name: Deploy to Hostinger via SSH Rsync
        if: success() && secrets.HOSTINGER_SSH_KEY != ''
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST != '' && secrets.HOSTINGER_HOST || '217.21.74.188' }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER != '' && secrets.HOSTINGER_USER || 'u390470426' }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH != '' && secrets.HOSTINGER_PATH || 'domains/atozgadgetz.com/public_html' }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 -H $HOSTINGER_HOST >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -p 65002 -o StrictHostKeyChecking=no" --exclude-from='.rsyncignore' ./ $HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_PATH
          ssh -p 65002 -o StrictHostKeyChecking=no $HOSTINGER_USER@$HOSTINGER_HOST "cd $HOSTINGER_PATH && (php artisan storage:link 2>/dev/null || true) && php artisan migrate --force && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"

