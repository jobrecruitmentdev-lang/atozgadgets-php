name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ secrets.HOSTINGER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          
      - name: Deploy via Rsync
        run: |
          rsync -avz -e "ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -v" \
            --exclude-from='.rsyncignore' \
            ./ u390470426@217.21.74.188:domains/atozgadgetz.com/public_html/
            
      - name: Post-Deploy Optimizations
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 65002 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes u390470426@217.21.74.188 "cd domains/atozgadgetz.com/public_html && rm -f bootstrap/cache/*.php && php artisan optimize:clear && php artisan optimize"
