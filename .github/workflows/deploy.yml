name: Deploy to Hostinger Shared Hosting

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Run Test Suite
        run: ./vendor/bin/phpunit

      - name: Deploy to Hostinger via SSH Rsync
        if: success() && env.HOSTINGER_SSH_KEY != ''
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOSTINGER_HOST >> ~/.ssh/known_hosts
          rsync -avz --delete --exclude='.git' --exclude='.env' --exclude='storage' --exclude='node_modules' ./ $HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_PATH
          ssh $HOSTINGER_USER@$HOSTINGER_HOST "cd $HOSTINGER_PATH && php artisan migrate --force && php artisan optimize:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache"
