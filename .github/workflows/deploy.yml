name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}


          
      - name: Deploy via Rsync
        run: |
          rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no" \
            --exclude-from='.rsyncignore' \
            ./ u390470426@217.21.74.188:domains/atozgadgetz.com/public_html/
            
      - name: Post-Deploy Optimizations
        run: |
          ssh -p 65002 -o StrictHostKeyChecking=no u390470426@217.21.74.188 "cd domains/atozgadgetz.com/public_html && php artisan optimize:clear && php artisan optimize"
